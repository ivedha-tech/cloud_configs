      name: Fetch Template
      action: fetch:template
      input:
        url: "https://github.com/ivedha-tech/platformnex-templates/tree/main/repos/backend-go-gin"
        targetPath: ${{ (parameters.component_type == 'Frontend' and './frontend') or './backend' }}
  output:
    links: []
