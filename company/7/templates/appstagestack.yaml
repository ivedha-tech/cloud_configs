apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: appstagestack
  title: appstagestack
  description: testingtesting
spec:
  owner: development-team
  type: yaml
  parameters:
    - title: "Basic Information"
      required: ["component_id", "owner", "system", "component_type", "environments"]
      properties:
        component_id:
          title: "Component ID"
          type: string
          ui:field: EntityNamePicker
          maxLength: 64
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        description:
          title: "Description"
          type: string
        owner:
          title: "Owner"
          type: string
          ui:field: OwnerPicker
        system:
          title: "System"
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
        component_type:
          title: "Component Type"
          type: string
          enum: [Frontend, Backend]
          default: Frontend
        deployment:
          title: "Deployment Platform"
          type: string
          description: "Deployment platform (e.g., gcp, aws, azure)"
        environments:
          title: "Environments"
          type: array
          items:
            type: string
            enum: [dev, qa, staging, prod]
          ui:widget: checkboxes
    - title: "Configuration"
      dependencies:
        component_type:
          oneOf:
            - properties:
                component_type:
                  const: Frontend
                frontend_framework:
                  title: "Frontend Framework"
                  type: string
                  enum: [React]
                  default: React
                frontend_language:
                  title: "Frontend Language"
                  type: string
                  enum: [Typescript]
                  default: Typescript
                frontend_styling:
                  title: "Frontend Styling"
                  type: string
                  enum: [TailwindCSS]
                  default: TailwindCSS
                frontend_state:
                  title: "Frontend State"
                  type: string
                  enum: [None]
                  default: None
                frontend_service_repository:
                  title: "Frontend Service Repository"
                  type: string
                  ui:field: RepoUrlPicker
                  ui:options:
                    allowedHosts: ["github.com"]
                frontend_service_branch:
                  title: "Frontend Service Branch"
                  type: string
                  default: main
              required:
                - frontend_framework
                - frontend_language
                - frontend_service_repository
                - frontend_service_branch
            - properties:
                component_type:
                  const: Backend
                backend_language:
                  title: "Backend Language"
                  type: string
                  enum: [Go, Node.js]
                  default: Go
                backend_framework:
                  title: "Backend Framework"
                  type: string
                  dependencies:
                    backend_language:
                      Go:
                        enum: ['Gin']
                        default: Gin
                      Node.js:
                        enum: ['Express', 'NestJS']
                        default: Express
                  default: Gin
                backend_service_repository:
                  title: "Backend Service Repository"
                  type: string
                  ui:field: RepoUrlPicker
                  ui:options:
                    allowedHosts: ["github.com"]
                backend_service_branch:
                  title: "Backend Service Branch"
                  type: string
                  default: main
              required:
                - backend_language
                - backend_framework
                - backend_service_repository
                - backend_service_branch
    - title: "CICD and Specs"
      properties:
        cloudbuild_yaml:
          title: "CloudBuild YAML"
          type: string
          ui:widget: textarea
        specs_yaml:
          title: "Specs YAML"
          type: string
          ui:widget: textarea
  steps:
    - id: fetch-template
      name: Fetch Template
      action: fetch:template
      input:
        url: "https://github.com/ivedha-tech/platformnex-templates/tree/main/repos/frontend-react-typescript-tailwindcss-none"
        targetPath: ${{ (parameters.component_type == 'Frontend' and './frontend') or './backend' }}
    - id: greenfield-write-yaml-1
      name: Write YAML File
      action: greenfield:write-yaml
      input:
        yamlContent: ${{ parameters.cloudbuild_yaml }}
        targetPath: ${{ (parameters.component_type == 'Frontend' and './frontend') or './backend' }}
        fileName: "cloudbuild.yaml"
    - id: publish-github-2
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ (parameters.component_type == 'Frontend' and parameters.frontend_service_repository) or parameters.backend_service_repository }}
        sourcePath: ${{ (parameters.component_type == 'Frontend' and './frontend') or './backend' }}
        defaultBranch: ${{ (parameters.component_type == 'Frontend' and parameters.frontend_service_branch) or parameters.backend_service_branch }}
        allowedHosts: ["github.com"]
  output:
    links:
      - title: Repository
        url: ${{ steps['publish-github-2'].output.remoteUrl }}
