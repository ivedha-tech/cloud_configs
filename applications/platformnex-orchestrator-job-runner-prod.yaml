apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: platformnex-orchestrator-job-runner-prod
  description: A Rust-based HTTP service that provides an endpoint to launch Cloud
    Run jobs by executing the cloud-run-job.sh script.
  annotations:
    backstage.io/source-location: https://github.com/ivedha-tech/platformnex-orchestrator-job-runner
    backstage.io/source-vcs: Github
    google.com/cloudbuild-trigger-name: platformnex-orchestrator-job-runner-PROD
    google.com/cloudbuild-project-slug: prj-platformnex-prod
    google.com/cloudbuild-location: us-central1
    google.com/gcp-projectid: prj-platformnex-prod
    mycompany.com/gcp-projectid: prj-platformnex-prod
    mycompany.com/gcp-provider: gcp
    mycompany.com/gcp-dataset-id: ds_billing
    mycompany.com/gcp-table-id: billing_summary_daily
spec:
  type: service
  lifecycle: production
  owner: group:default/platformnex-admin
  dependsOn: []
  dependencyOf: []
  system: system:default/platformnex
  providesApis: []
  consumesApis: []
