    jira.com/project-key: PLATNEX
spec:
  type: service
  lifecycle: development
  owner: group:default/platformnex-admin
  system: system:default/platformnex
  annotations:
    backstage.io/source-location: https://github.com/QAIvedha/platformnex_qa_automation
    backstage.io/source-vcs: github
